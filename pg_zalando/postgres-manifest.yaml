apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: acid-minimal-cluster
spec:
  teamId: "acid"
  volume:
    size: 1Gi
  numberOfInstances: 2
  enableLogicalBackup: true
  logicalBackupSchedule: "30 00 * * *"
  users:
    admin:
    - superuser
    - createdb
    xikolo: []  # role for the xikolo application
  databases:
    xikolo: xikolo  # dbname: owner
  postgresql:
    version: "16"
