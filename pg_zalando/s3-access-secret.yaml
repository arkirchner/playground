# S3 credentials for Spilo pods (pod_environment_secret), the logical backup
# CronJobs (logical_backup_cronjob_environment_secret) and the operator UI.
# Deliberately has no namespace: apply it into the operator namespace (for the
# UI) and into every namespace where postgresql clusters are deployed - the
# operator reads these secrets only from the cluster's own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: s3-access
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin123
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://minio.zalando-postgres-operator.svc.cluster.local:9000
  # MinIO has no KMS; Spilo would otherwise default WALG_S3_SSE to AES256
  WALG_DISABLE_S3_SSE: "true"
