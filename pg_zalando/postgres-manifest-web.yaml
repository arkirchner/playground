apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: xikolo-db
spec:
  resources:
    requests:
      cpu: "4"
      memory: "6Gi"
  teamId: "openHPI"
  volume:
    size: 200Gi
  numberOfInstances: 2
  preparedDatabases:
    xikolo:
      defaultUsers: true
      extensions:
        dblink: public
        pgcrypto: public
        unaccent: public
        uuid-ossp: public
        pg_trgm: public
        hstore: public
  postgresql:
    version: "16"
    parameters: # generated with pgtune
      max_connections: "100"
      shared_buffers: 1536MB
      effective_cache_size: 4608MB
      maintenance_work_mem: 384MB
      checkpoint_completion_target: "0.9"
      wal_buffers: 16MB
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "300"
      work_mem: 13610kB
      huge_pages: "false"
      jit: "false"
      wal_compression: lz4
      min_wal_size: 1GB
      max_wal_size: 4GB
      max_worker_processes: "4"
      max_parallel_workers_per_gather: "2"
      max_parallel_workers: "4"
      max_parallel_maintenance_workers: "2"
